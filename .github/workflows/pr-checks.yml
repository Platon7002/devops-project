name: PR Quality Check and Notification

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=Platon7002
            -Dsonar.projectKey=Platon7002_devops-project
            -Dsonar.sources=.
            -Dsonar.python.version=3

      - name: Create report file
        run: |
          echo "Отчёт по качеству кода для PR #${{ github.event.pull_request.number }}" > report.txt
          echo "Дата: $(date)" >> report.txt
          echo "Ветка: ${{ github.event.pull_request.head.ref }}" >> report.txt
          echo "Статус сканирования: успешно (SonarCloud)" >> report.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: quality-report
          path: report.txt

      - name: Send Telegram notification
        run: |
          python bot.py "$MESSAGE"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: |
            🚀 **Новый пулл‑реквест** 🚀
            Проект: ${{ github.repository }}
            Ветка: `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`
            📅 Дата: $(date +'%Y.%m.%d %H:%M:%S')
            🔗 Ссылка на PR: ${{ github.event.pull_request.html_url }}
            📂 Репозиторий: ${{ github.server_url }}/${{ github.repository }}
